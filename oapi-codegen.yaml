package: generated
output:
  directory: .
generate:
  client: true
  # Name every enum constant <Type><Value>, so a constant keeps its name when
  # another enum gains the same value.
  always-prefix-enum-values: true
# Generate only the operations the provider's resources call; unused components
# are pruned. openapi/openapi.yaml is the whole app spec (make sync-spec).
filter:
  include:
    operation-ids:
      - create_org
      - get_org
      - update_org
      - delete_org
      - update_org_budget
      - create_org_user
      - get_org_user
      - update_org_user_role
      - remove_org_user
      - set_org_member
      - get_org_member
      - remove_org_member
      - create_orgless_invite
      - create_team
      - get_team
      - update_team
      - delete_team
      - list_team_projects
      - add_team_project
      - remove_team_project
      - list_team_users
      - add_team_user
      - remove_team_user
      - create_project
      - get_project
      - update_project
      - patch_project
      - delete_project
      - create_project_token
      - get_project_token
      - update_project_token
      - delete_project_token
      - create_notification_channel
      - get_notification_channel
      - update_notification_channel
      - delete_notification_channel
      - get_monitor
      - delete_monitor
      - create_threshold_monitor
      - update_threshold_monitor
      - create_anomaly_monitor
      - update_anomaly_monitor
      - create_outlier_monitor
      - update_outlier_monitor
      - create_forecast_monitor
      - update_forecast_monitor
      - create_error_monitor
      - update_error_monitor
      - create_slo_monitor
      - update_slo_monitor
overlay:
  sources:
    - openapi/overlay.yaml
