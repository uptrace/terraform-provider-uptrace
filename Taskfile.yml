# Tasks of the Terraform provider module. The root Taskfile.yml includes this
# file as the terraform: namespace, so `task terraform:test` runs from the app
# root and `task test` runs from this directory.
#
# release_identity_test.go pins PKG_NAME and BINARY: change them with the
# registry address, the GoReleaser project and the module path.
version: '3'

vars:
  PKG_NAME: github.com/uptrace/terraform
  BINARY: terraform-provider-uptrace
  VERSION: '{{.VERSION | default "dev"}}'
  OS_ARCH:
    sh: echo "$(go env GOOS)_$(go env GOARCH)"
  # Every Go file of the module except the generated client. gofmt recurses
  # into a directory argument, so the list names files.
  GOFMT_FILES:
    sh: find . -name '*.go' -not -path './generated/*' | sort | tr '\n' ' '
  # The terraform CLI that docs and testacc download. Without a pin they take the
  # newest release, so a new release could change docs/ or fail a commit that
  # changed nothing. TF_ACC_TERRAFORM_PATH still names a local binary for testacc.
  TF_VERSION: '{{.TF_VERSION | default "1.17.1"}}'

tasks:
  build:
    desc: Build the provider binary.
    cmds:
      - go build -ldflags "-X {{.PKG_NAME}}/version.ProviderVersion={{.VERSION}}" -o {{.BINARY}} .

  install:
    desc: Install the provider binary into the local Terraform plugin directory.
    deps: [build]
    vars:
      PLUGIN_DIR: ~/.terraform.d/plugins/registry.terraform.io/uptrace/uptrace/{{.VERSION}}/{{.OS_ARCH}}
    cmds:
      - mkdir -p {{.PLUGIN_DIR}}
      - cp {{.BINARY}} {{.PLUGIN_DIR}}/

  test:
    desc: Run the unit tests. The acceptance tests skip without TF_ACC.
    cmds:
      - go test ./... -count=1

  testacc:
    desc: Run the acceptance tests against the API that .env or the shell names.
    env:
      TF_ACC: '1'
      TF_ACC_TERRAFORM_VERSION: '{{.TF_VERSION}}'
    cmds:
      - go test ./... -v -count=1 -timeout 10m

  sync-spec:
    desc: 'Vendor openapi/ of the app at a ref, e.g. task terraform:sync-spec REF=origin/prod. Then run generate.'
    requires:
      vars: [REF]
    cmds:
      - scripts/sync-spec.sh {{.APP_DIR | default ".."}} {{.REF}}

  generate:
    desc: Generate the API client in generated/ from openapi/openapi.yaml.
    cmds:
      - rm -f generated/*.go
      - go tool oapi-codegen -config oapi-codegen.yaml openapi/openapi.yaml

  docs:
    desc: Generate the registry documentation in docs/.
    cmds:
      - go tool tfplugindocs generate --provider-name uptrace --tf-version {{.TF_VERSION}}

  vet:
    cmds:
      - go vet $(go list ./... | grep -v /generated)

  lint:
    cmds:
      - golangci-lint run ./...

  fmt:
    cmds:
      - gofmt -s -w {{.GOFMT_FILES}}

  fmt:check:
    desc: Fail when a Go file outside generated/ is not gofmt-formatted.
    cmds:
      - |
        unformatted=$(gofmt -s -l {{.GOFMT_FILES}})
        if [ -n "$unformatted" ]; then
          echo "The following files are not gofmt'd:"
          echo "$unformatted"
          exit 1
        fi

  tidy:
    cmds:
      - go mod tidy
